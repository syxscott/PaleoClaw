packages:
  - .
  - ui
  - packages/*
  - extensions/*
  - examples/*
  - tools/solid-lint

linkWorkspacePackages: true

minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

# Trusted Codex runtimes are outside the dependency cooldown.
minimumReleaseAgeExclude:
  - "@openai/codex"
  - "@openai/codex-*"
  # Solid itself is exempt from the release-age gate (Peter, 2026-10-11).
  - "solid-js"
  - "@solidjs/*"
  # Reviewed Edge TTS 403 fix; remove after 2026-10-19T16:27:27.581Z.
  - "node-edge-tts@1.2.11"
  # Reviewed fs-safe 0.26.8 release and native helpers; remove after 2026-10-25T20:33:09.777Z.
  - "@openclaw/fs-safe@0.26.8"
  - "@openclaw/fs-safe-darwin-arm64@0.26.8"
  - "@openclaw/fs-safe-darwin-x64@0.26.8"
  - "@openclaw/fs-safe-freebsd-arm64@0.26.8"
  - "@openclaw/fs-safe-freebsd-x64@0.26.8"
  - "@openclaw/fs-safe-linux-arm64-gnu@0.26.8"
  - "@openclaw/fs-safe-linux-arm64-musl@0.26.8"
  - "@openclaw/fs-safe-linux-x64-gnu@0.26.8"
  - "@openclaw/fs-safe-linux-x64-musl@0.26.8"
  - "@openclaw/fs-safe-win32-arm64-msvc@0.26.8"
  - "@openclaw/fs-safe-win32-x64-msvc@0.26.8"
  # Security-fix picks reviewed while they clear the cooldown window (Dependency
  # Audit GHSA batch, 2026-11-01); each entry can be removed one week after publish.
  # GHSA-mrwp-f3q8-3g9p fix; remove after 2026-11-01T21:32:25.963Z.
  - "follow-redirects@1.16.2"
  # GHSA-4528-x5fx-h6hg fix; remove after 2026-11-04T09:59:49.641Z.
  - "joi@18.3.1"
  # Pulls @azure/msal-node ^7.1.0 (GHSA-xcx6-jx8p-x3h5 fix); remove after 2026-11-05T22:16:07.100Z.
  - "@azure/identity@4.14.1"
  - "@openclaw/proc-safe@0.4.2"
  - "@openclaw/proc-safe-darwin-arm64@0.4.2"
  - "@openclaw/proc-safe-darwin-x64@0.4.2"
  - "@openclaw/proc-safe-freebsd-arm64@0.4.2"
  - "@openclaw/proc-safe-freebsd-x64@0.4.2"
  - "@openclaw/proc-safe-linux-arm64-gnu@0.4.2"
  - "@openclaw/proc-safe-linux-arm64-musl@0.4.2"
  - "@openclaw/proc-safe-linux-x64-gnu@0.4.2"
  - "@openclaw/proc-safe-linux-x64-musl@0.4.2"
  - "@openclaw/proc-safe-win32-arm64-msvc@0.4.2"
  - "@openclaw/proc-safe-win32-x64-msvc@0.4.2"
  # Draft tsrs type-check trial (obviyus); remove after 2026-10-23T16:59:18.996Z.
  - "tsrs@0.16.0-ts7.1.0-dev.20260929"
  - "@tsrs/darwin-arm64@0.16.0-ts7.1.0-dev.20260929"
  - "@tsrs/linux-arm64-gnu@0.16.0-ts7.1.0-dev.20260929"
  - "@tsrs/linux-arm64-musl@0.16.0-ts7.1.0-dev.20260929"
  - "@tsrs/linux-x64-gnu@0.16.0-ts7.1.0-dev.20260929"
  - "@tsrs/linux-x64-musl@0.16.0-ts7.1.0-dev.20260929"

# Isolated installs let pnpm reuse whole-package APFS clones instead of relinking every file.
nodeLinker: isolated
# Private inodes keep sibling installs from changing compiler input ctimes.
packageImportMethod: clone-or-copy
# GWTs share node_modules; script commands must not reconcile that shared install.
verifyDepsBeforeRun: false
blockExoticSubdeps: true

overrides:
  # Memory LanceDB supplies vectors; WhatsApp prepares thumbnails with Rastermill.
  "@lancedb/lancedb>@huggingface/transformers": "-"
  "baileys>sharp": "-"
  "baileys>audio-decode": 3.12.0
  "chevrotain>lodash-es": 4.18.1
  "@chevrotain/cst-dts-gen>lodash-es": 4.18.1
  "@chevrotain/gast>lodash-es": 4.18.1
  "@agentclientprotocol/codex-acp@2.2.2>@openai/codex": 0.162.1
  "@codemirror/commands@6.11.1>@codemirror/view": 6.43.14
  "@codemirror/view@6.43.14>@codemirror/state": 6.7.6
  "@anthropic-ai/sdk": 0.133.0
  "@anthropic-ai/vertex-sdk@0.20.4>google-auth-library": 11.3.0
  "@opentelemetry/core": 2.12.0
  "@opentelemetry/propagator-jaeger": 2.12.0
  "@solidjs/vite-plugin@3.0.0-next.49>@solidjs/babel-plugin": 2.0.0-rc.14
  "@aws-sdk/core": 3.978.3
  "@aws-sdk/credential-provider-node": 3.972.86
  "@aws-sdk/xml-builder": 3.972.41
  "@hono/node-server": 2.1.4
  axios: 1.20.0
  fast-uri: 4.2.2
  defu: 6.1.7
  fast-xml-parser: 5.11.2
  request: "npm:@cypress/request@4.0.1"
  request-promise: "npm:@cypress/request-promise@5.0.0"
  basic-ftp: 6.2.3
  brace-expansion: 5.0.12
  # GHSA-68fv-2mgg-jv7q: source-map-js <1.2.2 event-loop DoS (via css-tree).
  source-map-js: 1.2.2
  file-type: 22.1.1
  form-data: 4.0.6
  ip-address: 10.7.4
  minimatch: 10.2.6
  path-to-regexp: 8.4.2
  proxy-addr: 2.0.8
  qs: 6.16.0
  node-domexception: "npm:@nolyfill/domexception@1.0.28"
  typebox: 1.3.37
  tar: 7.5.22
  tough-cookie: 6.0.2
  "tsdown>rolldown-plugin-dts": 0.28.8
  # Keep both Lit analyzers on the same classic compiler until they support native TS7.
  "web-component-analyzer@2.0.0>typescript": 6.0.3
  "zca-js@2.2.0>tough-cookie": 6.0.2
  yauzl: 3.4.0
  protobufjs: 8.8.1
  uuid: 14.0.3
  # GHSA-mrwp-f3q8-3g9p: follow-redirects <=1.16.1 can leak custom credentials
  # on cross-realm redirects.
  follow-redirects: 1.16.2
  # GHSA-27r3-jxmh-p828: body-parser DoS via trailing bytes after a compressed
  # body (via express 5).
  body-parser: 2.4.0
  # GHSA-4528-x5fx-h6hg: joi quadratic-time email split DoS (via mailauth).
  joi: 18.3.1
  # GHSA-gg6h-894w-4m9c: re2js quadratic-time lookbehind DoS (via crabline).
  re2js: 2.9.0
  # GHSA-88fw-hqm2-52qc: hono CORS reflects any Origin with credentials when
  # origin is unset (<4.12.25).
  hono: 4.13.13
  # GHSA-xjj6-f33q-929c / GHSA-4w7w-5xrc-9h26 / GHSA-2m5v-pch6-74hx /
  # GHSA-qrxm-fqhp-jwvm: undici DoS, cache poisoning, and TLS bypass fixes
  # (8.x line fixed in 8.12.2).
  undici: 8.12.3
  # GHSA-mrhx-c7xc-m3w5: zod memory exhaustion validating oversized constrained
  # collections; fixed only on the 4.6.6+ line, so the 3.x consumers are forced
  # across the major.
  zod: 4.6.7
  # GHSA-gfr2-rv44-r23c / GHSA-r7fv-28h4-cvq7: markdown-it quadratic rendering
  # fixed in 14.3.3; peer specs are '*' so one version is coherent.
  markdown-it: 14.3.3
  # GHSA-96hv-2xvq-fx4p: ws DoS via many-headers frame; @buape/carbon pins 8.20.0.
  "@buape/carbon>ws": 8.22.0
  # GHSA-xcx6-jx8p-x3h5: msal-node auth-code flow disclosure, fixed in 7.1.0;
  # @microsoft/teams.apps 2.1.1 still declares ^5.6.0 (no upstream fix).
  "@microsoft/teams.apps>@azure/msal-node": 7.1.1
  # GHSA-x6jw-m9v5-85vh / GHSA-g4wm-2vf7-vfgr / GHSA-858h-whjf-mvg5:
  # simple-git command execution fixes landed in 4.0.1; node-llama-cpp still
  # declares ^3.36.0 (its awaited simple-git API is unchanged in 4.x).
  "node-llama-cpp>simple-git": 4.0.2

allowBuilds:
  "@napi-rs/canvas": true
  "node-llama-cpp": true
  sharp: true
  onnxruntime-node: false
  "@google/genai": true
  "@lydell/node-pty": true
  "@matrix-org/matrix-sdk-crypto-nodejs": true
  "@tloncorp/api": true
  "@tloncorp/tlon-skill": true
  baileys: true
  authenticate-pam: true
  "@discordjs/opus": false
  esbuild: true
  koffi: false
  protobufjs: true
  tree-sitter-bash: false
  paleoclaw: true
  "@openclaw/proxyline": true
  clawpdf: true
  "@openclaw/crabline": true
  rastermill: true
  node-pty: true

packageExtensions:
  # rc14 imports long directly; protobufjs's transitive edge is not visible in isolated graphs.
  "baileys@7.0.0-rc14":
    dependencies:
      long: 5.3.2
  # The transient npm lock generator also needs the peer marked optional.
  baileys:
    peerDependenciesMeta:
      sharp:
        optional: true

patchedDependencies:
  "baileys@7.0.0-rc14": patches/baileys@7.0.0-rc14.patch
  "matrix-js-sdk@43.0.0": patches/matrix-js-sdk@43.0.0.patch
  "@novnc/novnc@1.7.0": patches/@novnc__novnc@1.7.0.patch
  vitest@5.0.3: patches/vitest@5.0.3.patch
  ghostty-web@0.4.0: patches/ghostty-web@0.4.0.patch
  chrome-devtools-mcp@1.10.1: patches/chrome-devtools-mcp@1.10.1.patch
