<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>paleoclaw Control</title>
    <meta name="color-scheme" content="dark light" />
    <!-- These mirror the theme's --bg tokens for first paint; runtime theme application keeps them synchronized. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12141a" />
    <script>
      // No-flash theme bootstrap: applies the persisted theme before first paint.
      // Mirrors applyResolvedTheme() in src/ui/app-settings.ts (key from src/ui/storage.ts).
      (function () {
        try {
          var settings = JSON.parse(localStorage.getItem("paleoclaw.control.settings.v1") || "{}");
          var mode =
            settings.theme === "light" || settings.theme === "dark" ? settings.theme : "system";
          var resolved =
            mode === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (err) {
          /* Storage blocked or unparsable: keep the stylesheet's default theme. */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <paleoclaw-app></paleoclaw-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
