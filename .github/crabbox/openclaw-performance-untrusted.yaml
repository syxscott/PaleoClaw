provider: aws
target: linux
architecture: amd64
class: beast
serverType: c7a.24xlarge
capacity:
  market: on-demand
lease:
  idleTimeout: 30m
  ttl: 240m
cache:
  pnpm: false
  npm: false
  docker: false
  git: false
  maxGB: 1
  purgeOnRelease: true
sync:
  delete: true
  checksum: true
  gitSeed: false
  fingerprint: false
  include:
    - .github/crabbox/paleoclaw-performance-evidence.schema.json
    - scripts/paleoclaw-performance-crabbox.sh
    - .github/crabbox/performance-control/ocm
    - .github/crabbox/performance-control/ocm.sha256
    - .github/crabbox/performance-control/helpers/bench-cli-startup.mjs
    - .github/crabbox/performance-control/helpers/kova-ci-summary.mjs
    - .github/crabbox/performance-control/helpers/lib/kova-report-gate.mjs
    - .github/crabbox/performance-control/helpers/lib/kova-report-selector.mjs
    - .github/crabbox/performance-control/helpers/lib/kova-workflow-evidence.mjs
    - .github/crabbox/performance-control/helpers/paleoclaw-performance-source-summary.mjs
env:
  allow:
    - OPENCLAW_PERFORMANCE_NO_ENV
