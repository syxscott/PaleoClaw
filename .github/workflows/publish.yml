name: Publish to npm

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance is attested with the workflow identity.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 12.12.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          echo "Build output verified:"
          ls -la dist/

      - name: Prepare the publishable package
        # The root package depends on workspace packages, so it cannot be packed directly.
        # Build the self-contained tarball the release tooling expects instead.
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/package-paleoclaw-for-docker.mjs \
            --pnpm-pack \
            --allow-unreleased-changelog \
            --output-dir .release-tarball \
            --output-name "paleoclaw-${VERSION}.tgz"
          ls -la .release-tarball/

      - name: Publish to npm
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view paleoclaw@$VERSION version 2>/dev/null; then
            echo "Version $VERSION already published, skipping..."
            exit 0
          fi
          bash scripts/paleoclaw-npm-publish.sh --publish ".release-tarball/paleoclaw-${VERSION}.tgz"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
