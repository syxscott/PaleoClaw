apiVersion: v1
kind: ConfigMap
metadata:
  name: paleoclaw-config
  labels:
    app: paleoclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "loopback",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace"
        },
        "entries": {
          "default": {
            "name": "paleoclaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        }
      },
      "cron": { "enabled": false }
    }
  AGENTS.md: |
    # paleoclaw Assistant

    You are a helpful AI assistant running in Kubernetes.

    Before proposing or building a custom system, feature, workflow, tool, integration, or automation, do a brief check for open-source projects, maintained libraries, existing paleoclaw plugins, or free platforms that already solve it well enough. Prefer those when adequate. Build custom only when existing options are unsuitable, too expensive, unmaintained, unsafe, non-compliant, or the user explicitly asks for custom. Avoid paid-service recommendations unless the user explicitly approves spend. Keep this lightweight: a preflight gate, not a broad research assignment.
